<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,100..900;1,100..900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="IATMSI-2027 - IEEE International Conference on Interdisciplinary Approaches in Technology and Management for Social Innovation. 20-22 May 2027 at ABV-IIITM, Gwalior, India." />
  <meta name="keywords"
    content="IATMSI-2027, green technology, sustainable technology, academic conference, ABV-IIITM, Gwalior, green manufacturing, electric vehicles, clean energy, circular economy" />
  <meta name="author" content="ABV-IIITM, Gwalior" />
  <title>IATMSI-2027 | IEEE International Conference on Interdisciplinary Approaches in Technology and Management for Social Innovation
  </title>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Weavr Visual WYSIWYG Dev Bridge
    if (window.self !== window.top) {
      const enableWeavrEditing = () => {
        const style = document.createElement('style');
        style.id = 'weavr-editor-styles';
        style.innerHTML = `
          [contenteditable="true"] {
            outline: 2px dashed #d4a244 !important;
            outline-offset: 3px !important;
            transition: all 0.15s ease !important;
            cursor: text !important;
          }
          [contenteditable="true"]:hover {
            outline: 2px solid #722332 !important;
            background-color: rgba(212, 162, 68, 0.1) !important;
          }
          [contenteditable="true"]:focus {
            outline: 2px solid #d4a244 !important;
            background-color: rgba(212, 162, 68, 0.15) !important;
            box-shadow: 0 4px 12px rgba(114, 35, 50, 0.15) !important;
          }
        `;
        document.head.appendChild(style);

        const makeEditable = () => {
          document.querySelectorAll('h1, h2, h3, h4, h5, h6, p, button, a, span.font-black, span.font-bold, li, td, th').forEach((el) => {
            if (el.tagName === 'A') {
              el.addEventListener('click', (e) => e.preventDefault());
            }
            el.setAttribute('contenteditable', 'true');
            el.setAttribute('spellcheck', 'false');
          });
        };

        setTimeout(makeEditable, 800);
        const observer = new MutationObserver(makeEditable);
        observer.observe(document.body, { childList: true, subtree: true });
      };

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', enableWeavrEditing);
      } else {
        enableWeavrEditing();
      }
    }
  </script>
</body>

</html>
